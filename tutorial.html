<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearBudget Tutorial</title>

    <!-- ============ STYLE ============ -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
            color: #2d3748;
            text-align: center;
        }

        header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
            color: white;
            padding: 25px 0;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .video-box {
            margin-top: 25px;
            padding: 60px;
            border: 3px dashed #2563eb;
            border-radius: 15px;
            color: #2563eb;
            font-size: 22px;
            background: #eef2ff;
            font-weight: 600;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            font-size: 14px;
            color: #6b7280;
        }

        .lang-switch {
            margin-top: 15px;
            font-size: 14px;
        }
        .lang-switch a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header id="title">
    ClearBudget Tutorial Video
</header>

<div class="container">

    <h2 id="subtitle">Tutorial Video Coming Soon</h2>

    <p id="desc">
        The instructional video will be available here as soon as it is published.
    </p>

    <div class="video-box" id="placeholder-text">
        🎬 Video will be added here soon
    </div>

    <div class="lang-switch" id="lang-switch">
        <!-- JS will fill this -->
    </div>

</div>

<footer>
    © 2025 Bezef Programmation — All Rights Reserved
</footer>

<!-- ============ MULTI-LANGUAGE SCRIPT ============ -->
<script>
    const userLang = navigator.language.split('-')[0]; // ar, en, fr...

    // ====== ترجمة النصوص لكل لغة ======
    const translations = {
        ar: {
            title: "فيديو شرح تطبيق ClearBudget",
            subtitle: "فيديو الشرح سيُضاف قريبًا",
            desc: "سيتم نشر الفيديو التعليمي هنا فور الانتهاء منه.",
            placeholder: "🎬 سيتم إضافة الفيديو هنا قريبًا",
            switch: "الانتقال إلى الإنجليزية",
            switchURL: "#"
        },
        en: {
            title: "ClearBudget Tutorial Video",
            subtitle: "Tutorial Video Coming Soon",
            desc: "The instructional video will be available here as soon as it is published.",
            placeholder: "🎬 Video will be added here soon",
            switch: "Switch to Arabic",
            switchURL: "#"
        },
        fr: {
            title: "Vidéo Tutoriel ClearBudget",
            subtitle: "La vidéo sera bientôt disponible",
            desc: "La vidéo d'instruction sera publiée ici prochainement.",
            placeholder: "🎬 La vidéo sera ajoutée ici bientôt",
            switch: "Passer à l'anglais"
        },
        de: {
            title: "ClearBudget Anleitungsvideo",
            subtitle: "Anleitungsvideo kommt bald",
            desc: "Das Lernvideo wird hier veröffentlicht, sobald es verfügbar ist.",
            placeholder: "🎬 Das Video wird bald hinzugefügt"
        },
        it: {
            title: "Video Tutorial ClearBudget",
            subtitle: "Il video sarà disponibile presto",
            desc: "Il video didattico sarà disponibile qui a breve.",
            placeholder: "🎬 Il video verrà aggiunto presto"
        },
        es: {
            title: "Video Tutorial de ClearBudget",
            subtitle: "El video estará disponible pronto",
            desc: "El video instructivo estará aquí pronto.",
            placeholder: "🎬 El video se añadirá pronto"
        },
        pt: {
            title: "Vídeo Tutorial ClearBudget",
            subtitle: "O vídeo estará disponível em breve",
            desc: "O vídeo tutorial será publicado aqui assim que estiver pronto.",
            placeholder: "🎬 O vídeo será adicionado em breve"
        },
        ru: {
            title: "Учебное видео ClearBudget",
            subtitle: "Видео скоро будет доступно",
            desc: "Учебное видео появится здесь в ближайшее время.",
            placeholder: "🎬 Видео скоро будет добавлено"
        },
        zh: {
            title: "ClearBudget教程视频",
            subtitle: "教程视频即将推出",
            desc: "教程视频将在发布后立即显示在这里。",
            placeholder: "🎬 视频即将添加"
        },
        hi: {
            title: "ClearBudget ट्यूटोरियल वीडियो",
            subtitle: "वीडियो जल्द उपलब्ध होगा",
            desc: "ट्यूटोरियल वीडियो जल्द ही यहाँ उपलब्ध होगा।",
            placeholder: "🎬 वीडियो जल्द ही जोड़ा जाएगा"
        },
        id: {
            title: "Video Tutorial ClearBudget",
            subtitle: "Video akan segera tersedia",
            desc: "Video tutorial akan segera dipublikasikan di sini.",
            placeholder: "🎬 Video akan ditambahkan segera"
        },
        ja: {
            title: "ClearBudget チュートリアル動画",
            subtitle: "動画はまもなく公開されます",
            desc: "チュートリアル動画は近日中にここに公開されます。",
            placeholder: "🎬 動画は近日追加されます"
        },
        ko: {
            title: "ClearBudget 튜토리얼 영상",
            subtitle: "영상이 곧 제공됩니다",
            desc: "튜토리얼 영상은 곧 이곳에 게시됩니다.",
            placeholder: "🎬 영상은 곧 추가됩니다"
        },
        tr: {
            title: "ClearBudget Eğitim Videosu",
            subtitle: "Video yakında hazır olacak",
            desc: "Eğitim videosu yakında burada yayınlanacak.",
            placeholder: "🎬 Video yakında eklenecek"
        },
        el: {
            title: "Βίντεο εκμάθησης ClearBudget",
            subtitle: "Το βίντεο θα είναι σύντομα διαθέσιμο",
            desc: "Το εκπαιδευτικό βίντεο θα αναρτηθεί εδώ σύντομα.",
            placeholder: "🎬 Το βίντεο θα προστεθεί σύντομα"
        }
    };

    // ===== اختيار الترجمة =====
    const t = translations[userLang] || translations["en"];

    // ===== تطبيق الترجمة في الصفحة =====
    document.getElementById("title").innerText = t.title;
    document.getElementById("subtitle").innerText = t.subtitle;
    document.getElementById("desc").innerText = t.desc;
    document.getElementById("placeholder-text").innerText = t.placeholder;

    // ===== زر التبديل بين اللغتين (AR / EN فقط) =====
    let switchText = "";
    if (userLang === "ar") {
        switchText = `<a href="#" onclick="setEnglish()">English</a>`;
    } else {
        switchText = `<a href="#" onclick="setArabic()">العربية</a>`;
    }
    document.getElementById("lang-switch").innerHTML = switchText;

    // ===== وظائف تغيير اللغة =====
    function setArabic() {
        document.getElementById("title").innerText = translations["ar"].title;
        document.getElementById("subtitle").innerText = translations["ar"].subtitle;
        document.getElementById("desc").innerText = translations["ar"].desc;
        document.getElementById("placeholder-text").innerText = translations["ar"].placeholder;
    }

    function setEnglish() {
        document.getElementById("title").innerText = translations["en"].title;
        document.getElementById("subtitle").innerText = translations["en"].subtitle;
        document.getElementById("desc").innerText = translations["en"].desc;
        document.getElementById("placeholder-text").innerText = translations["en"].placeholder;
    }
</script>

</body>
</html>
